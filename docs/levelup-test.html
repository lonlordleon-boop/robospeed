<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レベルアップ音くらべ</title>
<!-- 10機ごとの節目の音（9-6ad）を選ぶための **一時的な頁**。
     決まったら、この頁と audio/levelup_try/ は消します。 -->
<style>
  body { margin:0; padding:26px 18px 60px; background:#12171a; color:#e8ecee;
         font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; line-height:1.7; }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  p.note { font-size:13px; color:#98a3a9; margin:0 0 18px; }
  .card { border:1px solid #39424a; border-radius:12px; padding:14px 16px; margin:12px 0; }
  .card b { display:block; font-size:15px; margin-bottom:2px; }
  .card i { display:block; font-style:normal; font-size:12px; color:#98a3a9; margin-bottom:10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { flex:1 1 0; min-width:130px; padding:11px 14px; font-size:14px; font-weight:700;
           border-radius:9px; border:1px solid #2ec4b6; background:rgba(46,196,182,.12);
           color:#2ec4b6; cursor:pointer; }
  button.mix { border-color:#ffb300; background:rgba(255,179,0,.12); color:#ffb300; }
  button:hover { filter:brightness(1.3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>レベルアップ音くらべ</h1>
  <p class="note">「単体で鳴らす」は音そのもの。「本番の順で鳴らす」は<b>撃破音 → ほめ言葉の声 → レベルアップ音</b>の順で、実際と同じ間隔で鳴らします。</p>
  <div id="list"></div>
</div>
<script>
const CAND = [
  ["cand_A_fanfare", "A案 ファンファーレ", "金管風。タタ・ターンと和音が伸びる（1.9秒）"],
  ["cand_B_bell",    "B案 鐘",             "チャイム。金属的で余韻が長い（2.3秒）"],
  ["cand_C_arcade",  "C案 電子のパワーアップ", "階段を駆け上がる。昔のゲーム風（1.6秒）"],
  ["cand_D_taiko",   "D案 太鼓＋シャーン",   "ドンと打って、シンバルが残る（1.9秒）"],
  ["cand_now",       "いまの音",            "駆け上がり＋和音（1.0秒）"],
];
const host = document.getElementById("list");
for (const [file, title, desc] of CAND) {
  const c = document.createElement("div");
  c.className = "card";
  const b = document.createElement("b"); b.textContent = title;
  const i = document.createElement("i"); i.textContent = desc;
  const row = document.createElement("div"); row.className = "row";
  const one = document.createElement("button");
  one.textContent = "▶ 単体で鳴らす";
  one.onclick = () => new Audio("audio/levelup_try/" + file + ".wav").play();
  const mix = document.createElement("button");
  mix.className = "mix";
  mix.textContent = "▶ 本番の順で鳴らす";
  mix.onclick = () => {
    const play = (src, vol, at) => setTimeout(() => {
      const a = new Audio(src); a.volume = vol; a.play();
    }, at);
    play("audio/se_kill_e.wav", 0.5, 0);
    play("audio/se_praise_amazing.wav", 0.45, 704);
    play("audio/levelup_try/" + file + ".wav", 0.65, 976);
  };
  row.appendChild(one); row.appendChild(mix);
  c.appendChild(b); c.appendChild(i); c.appendChild(row);
  host.appendChild(c);
}
</script>
</body>
</html>
